<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم عيادة وصيدلية د. أحمد البيطرية السحابية</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --warning: #ea580c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 28px;
        }

        /* شاشة تسجيل الدخول */
        #loginOverlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 360px;
        }
        .login-box h2 { margin-top: 0; color: #1e293b; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        .login-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* المحتوى الرئيسي للوحة التحكم */
        #mainContent { display: none; }

        /* أزرار التحكم والتبديل */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        .tabs { display: flex; gap: 10px; }
        .tab-btn {
            padding: 10px 20px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            color: #475569;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        .btn-refresh {
            padding: 12px 25px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* كروت الإحصائيات الفلات ثلاثية الأبعاد */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            border-bottom: 4px solid #cbd5e1;
        }
        .card h3 { margin: 0; color: var(--text-muted); font-size: 15px; }
        .card p { margin: 10px 0 0; font-size: 26px; font-weight: bold; }

        /* الجداول والقوائم */
        .table-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            overflow-x: auto;
        }
        .table-section h2 { margin-top: 0; font-size: 20px; color: #1e293b; padding-bottom: 10px; border-bottom: 2px solid #f1f5f9; }
        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; min-width: 600px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; }
        tr:hover { background-color: #f8fafc; }

        .loading { text-align: center; color: var(--primary); font-weight: bold; display: none; margin: 20px 0; font-size: 16px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>تسجيل الدخول الآمن</h2>
        <p style="color:var(--text-muted); font-size:14px;">يرجى إدخال كلمة المرور لمتابعة الصيدلية عن بعد</p>
        <input type="password" id="passInput" placeholder="أدخل كلمة المرور هنا">
        <button onclick="checkPassword()">دخول النظام 🔓</button>
    </div>
</div>

<div class="container" id="mainContent">
    <h1>لوحة المتابعة والتحكم السحابي الفوري</h1>
    
    <div class="controls-row">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchView('Invoices', this)">فواتير المبيعات 📑</button>
            <button class="tab-btn" onclick="switchView('AnimalCases', this)">الحالات والعيادة 🩺</button>
            <button class="tab-btn" onclick="switchView('Items', this)">جرد المخزن والأصناف 📦</button>
        </div>
        <button class="btn-refresh" onclick="fetchCurrentActiveSheet()">تحديث البيانات الحية 🔄</button>
    </div>

    <div id="loadingText" class="loading">جاري مزامنة وسحب البيانات الحية من السيرفر السحابي...</div>

    <div class="card-grid" id="statsGrid">
        </div>

    <div class="table-section">
        <h2 id="tableTitle">فواتير المبيعات الحية</h2>
        <table id="dataTable">
            <thead id="tableHead">
                </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // ✅ الرابط السحابي المباشر الخاص بجوجل سكريبت لتطبيقك
const cloudServerUrl = "https://script.google.com/macros/s/AKfycbzfviNGDaaS-WkLxUuD7azW83XBtilpkLI3N4F_PCQ2If7XBsjeHYKCIYGP3jRxOtjA/exec";    let currentSheet = "Invoices";

    // دالة فحص كلمة المرور لتأمين لوحة التحكم الخاصة بك (يمكنك تغيير 123456 لأي رقم سري تحبه)
    function checkPassword() {
        const pass = document.getElementById('passInput').value;
        if(pass === "123456") { 
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            fetchCurrentActiveSheet();
        } else {
            alert("كلمة المرور غير صحيحة! برجاء المحاولة مرة أخرى.");
        }
    }

    // التبديل بين جداول (الفواتير - العيادة - الأصناف والمخازن)
    function switchView(sheetName, btn) {
        currentSheet = sheetName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.remove('active');
        btn.classList.add('active');
        
        const titles = { 'Invoices': 'فواتير المبيعات الحية', 'AnimalCases': 'سجلات الحالات والعيادة البيطرية', 'Items': 'جرد الأصناف والمستودعات الحالية' };
        document.getElementById('tableTitle').innerText = titles[sheetName];
        
        fetchCurrentActiveSheet();
    }

    // سحب البيانات من السيرفر السحابي
    function fetchCurrentActiveSheet() {
        document.getElementById('loadingText').style.display = 'block';
        
        fetch(cloudServerUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'getData', sheetName: currentSheet })
        })
        .then(response => response.json())
        .then(res => {
            document.getElementById('loadingText').style.display = 'none';
            if(res.result === 'success') {
                processAndRender(res.data);
            }
        }).catch(err => {
            document.getElementById('loadingText').innerText = "خطأ: تأكد من اتصال الكمبيوتر بالإنترنت والمزامنة!";
            console.error(err);
        });
    }

    // معالجة ورسم البيانات والكروت بناءً على التبويب المختار
    function processAndRender(data) {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        const statsGrid = document.getElementById('statsGrid');
        
        thead.innerHTML = "";
        tbody.innerHTML = "";
        statsGrid.innerHTML = "";

        if (!data || data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='10' style='text-align:center;'>لا توجد بيانات مرفوعة في هذا الجدول حتى الآن.</td></tr>";
            return;
        }

        // 1. بناء رؤوس الجدول ديناميكياً بناء على العناوين القادمة من جوجل شيت
        let headers = data[0];
        let headRow = "<tr>";
        headers.forEach(h => headRow += `<th>${h}</th>`);
        headRow += "</tr>";
        thead.innerHTML = headRow;

        // 2. بناء الأسطر والبيانات
        for(let i = 1; i < data.length; i++) {
            let row = data[i];
            let tr = "<tr>";
            row.forEach(cell => {
                tr += `<td>${cell !== undefined && cell !== null ? cell : '-'}</td>`;
            });
            tr += "</tr>";
            tbody.innerHTML += tr;
        }

        // 3. حساب وبناء بطاقات الإحصائيات السريعة الذكية (Dashboard Cards)
        if (currentSheet === "Invoices") {
            let total = 0, cash = 0, bank = 0;
            for(let i = 1; i < data.length; i++) {
                total += parseFloat(data[i][2]) || 0; // TotalAmount
                cash += parseFloat(data[i][3]) || 0;  // PaidCash
                bank += parseFloat(data[i][4]) || 0;  // PaidBank
            }
            statsGrid.innerHTML = `
                <div class="card" style="border-bottom: 4px solid var(--primary);"><h3>إجمالي الإيرادات (جنيه)</h3><p style="color:var(--primary);">${total.toFixed(2)}</p></div>
                <div class="card" style="border-bottom: 4px solid var(--success);"><h3>المدفوعات النقدية (كاش)</h3><p style="color:var(--success);">${cash.toFixed(2)}</p></div>
                <div class="card" style="border-bottom: 4px solid #0284c7;"><h3>مدفوعات الفيزا / الشبكة</h3><p style="color:#0284c7;">${bank.toFixed(2)}</p></div>
                <div class="card" style="border-bottom: 4px solid var(--warning);"><h3>عدد الفواتير المنفذة</h3><p style="color:var(--warning);">${data.length - 1}</p></div>
            `;
        } 
        else if (currentSheet === "AnimalCases") {
            let totalCost = 0;
            for(let i = 1; i < data.length; i++) {
                totalCost += parseFloat(data[i][6]) || 0; // ServiceCost
            }
            statsGrid.innerHTML = `
                <div class="card" style="border-bottom: 4px solid var(--warning);"><h3>إجمالي كشوفات العيادة</h3><p style="color:var(--warning);">${totalCost.toFixed(2)} ج.م</p></div>
                <div class="card" style="border-bottom: 4px solid var(--primary);"><h3>إجمالي عدد الحالات</h3><p style="color:var(--primary);">${data.length - 1}</p></div>
            `;
        }
        else if (currentSheet === "Items") {
            statsGrid.innerHTML = `
                <div class="card" style="border-bottom: 4px solid var(--success);"><h3>إجمالي عدد الأصناف بالمخزن</h3><p style="color:var(--success);">${data.length - 1}</p></div>
            `;
        }
    }
</script>
</body>
</html>
